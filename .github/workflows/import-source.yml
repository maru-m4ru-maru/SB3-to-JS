name: Import source archive
on:
  push:
    branches:
      - main
    paths:
      - stage/READY
permissions:
  contents: write
jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct and import source
        shell: bash
        run: |
          set -euo pipefail
          test -f stage/READY
          test "$(find stage -maxdepth 1 -type f -name 'part-*.b64' | wc -l | tr -d ' ')" = "37"
          find stage -maxdepth 1 -type f -name 'part-*.b64' | sort | xargs cat > /tmp/source.zip.b64
          base64 --decode /tmp/source.zip.b64 > /tmp/source.zip
          echo "63531c278215b4770af74f74b7c44143efdb2ac1089141d8a1c3496b0df5c1a3  /tmp/source.zip" | sha256sum --check
          unzip -t /tmp/source.zip
          mkdir -p /tmp/source-import
          unzip -q /tmp/source.zip -d /tmp/source-import
          test -d /tmp/source-import/sb3-to-js
          test -f /tmp/source-import/sb3-to-js/package.json
          cp -a /tmp/source-import/sb3-to-js/. .
          rm -rf stage .github/workflows/import-source.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No source changes found"; exit 1; }
          git commit -m "Add SB3-to-JS compiler source"
          git push origin HEAD:main
