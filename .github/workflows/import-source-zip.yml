name: Import compiler archive

on:
  push:
    branches:
      - main
    paths:
      - "sb3-to-js-source.zip"

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Extract source and create the project tree
        shell: bash
        run: |
          set -euo pipefail
          test -f sb3-to-js-source.zip
          mkdir -p "$RUNNER_TEMP/sb3-to-js"
          unzip -q sb3-to-js-source.zip -d "$RUNNER_TEMP/sb3-to-js"
          test -d "$RUNNER_TEMP/sb3-to-js/sb3-to-js"
          cp -a "$RUNNER_TEMP/sb3-to-js/sb3-to-js/." .
          rm -f sb3-to-js-source.zip
          rm -f .github/workflows/import-source-zip.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import SB3-to-JS compiler source"
          git push origin HEAD:main
